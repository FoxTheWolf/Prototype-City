<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terminal City</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas id="screen"></canvas>
  <div id="overlay">
    <div>
      <h1>TERMINAL CITY</h1>
      <p class="hint">WASD move &middot; mouse looks &middot; SHIFT runs &middot; ESC pauses</p>
      <div id="loading">
        <div class="bar"><div class="fill"></div><div class="shine"></div></div>
        <p class="status"><span class="what">BOOTING .</span><span class="pct">0%</span></p>
      </div>
      <p id="tip"><span class="head"></span><span class="text"></span></p>
      <div id="ready" hidden>
        <button id="continue" type="button" hidden>CONTINUE</button>
        <button id="start" type="button">NEW GAME</button>
        <button id="cctv" class="alt" type="button">WATCH CCTV</button>
        <button id="options" class="alt" type="button">OPTIONS</button>
        <p class="saveinfo"></p>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
